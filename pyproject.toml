[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vntr-eval"
version = "0.1.0"
description = "Making the pangenome graph align VNTRs better: test regions, evaluation tools and results"
readme = "README.md"
requires-python = ">=3.9"
# The realignment pipeline, pinned to a published commit.
dependencies = [
    "pgrealign @ git+https://github.com/benedictpaten/pgrealign@600ebdf7e82fa03010053ecc93158b9de5665a4d",
]

[tool.setuptools]
packages = []
